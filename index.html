<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RPS Card Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="title">Rock Paper Scissors: Card Duel</h1>
    </div>


    <div id="scoreboard">
        <p>Player Score: <span id="human-score">0</span> | Computer Score: <span id="computer-score">0</span></p>
        <div id="round-result">Select your Card!</div>
        <div id="winner-announcement"></div>
        <button id="reset-btn" style="display: none;">Play Again</button>
    </div>

    <!-- clickable cards -->
     <div class="card-container">
        <div class="card" data-choice="rock">
            <div class="card-artwork">
                <img src="images/rock.jpg" alt="Rock card artwork">
            </div>
        </div>

        <div class="card" data-choice="paper">
            <div class="card-artwork">
                <img src="images/paper.jpg" alt="Paper card artwork">
            </div>
        </div>

        <div class="card" data-choice="scissors">
            <div class="card-artwork">
                <img src="images/scissor.jpg" alt="Scissors card artwork">
            </div>
        </div>

     </div>
</body>
</html>
